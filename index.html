<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CrowdYOLO Monitor</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 20px; }
    img { max-width: 90%; border: 3px solid #222; }
    .info { font-size: 20px; margin-top: 10px; }
    .level { font-size: 28px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>CrowdYOLO Live Dashboard</h1>
  <div id="info" class="info">Loading...</div>
  <img id="snapshot" src="" alt="snapshot" />
  <script>
    async function update() {
      try {
        const statusURL = "https://raw.githubusercontent.com/ahmdzulf14-commits/CACRO-PDTBOS/main/status.json";
        const imageURL  = "https://raw.githubusercontent.com/ahmdzulf14-commits/CACRO-PDTBOS/main/snapshot.jpg";
        const r = await fetch(statusURL + "?cache=" + Date.now());
        const status = await r.json();
        document.getElementById("info").innerHTML = `<strong>Jumlah Orang:</strong> ${status.people_count} <div class="level">Status: ${status.level}</div><div>${status.timestamp}</div>`;
        document.getElementById("snapshot").src = imageURL + "?cache=" + Date.now();
      } catch (e) {
        document.getElementById("info").innerText = "No data yet or error: " + e;
      }
    }
    setInterval(update, 3000);
    update();
  </script>
</body>
</html>
